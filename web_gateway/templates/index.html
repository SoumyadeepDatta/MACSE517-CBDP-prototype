<!DOCTYPE html>
<html>

<head>
    <title>Attendance Reconciliation System</title>
</head>

<body>
    <h2>Invigilator Login</h2>
    <p>Authenticate against the campus FTP server to begin marking absentees.</p>

    {% if error %}
    <p><b>{{ error }}</b></p>
    {% endif %}

    <!-- Credentials are verified by logging in to the FTP server -->
    <form action="/login" method="POST">

        <label>Employee Username:</label><br>
        <!-- Dummy credential to test with: employee_123 -->
        <input type="text" name="username" required><br><br>

        <label>Password:</label><br>
        <!-- Dummy credential to test with: password123 -->
        <input type="password" name="password" required><br><br>

        <button type="submit">Authenticate</button>

    </form>
</body>

</html>
