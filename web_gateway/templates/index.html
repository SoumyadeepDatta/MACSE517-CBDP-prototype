<!DOCTYPE html>
<html>

<head>
    <title>Attendance Reconciliation System</title>
</head>

<body>
    <h2>Upload Present Candidates Workbook</h2>
    <p>Submit your credentials and the session spreadsheet to the campus FTP server.</p>

    <!-- Send credentials and file payload to the Python web gateway -->
    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label>Employee Username:</label><br>
        <!-- Dummy credential to test with: employee_123 -->
        <input type="text" name="username" required><br><br>

        <label>Password:</label><br>
        <!-- Dummy credential to test with: password123 -->
        <input type="password" name="password" required><br><br>

        <label>Attendance Evidence (.xlsx):</label><br>
        <input type="file" name="file" accept=".xlsx" required><br><br>

        <button type="submit">Authenticate & Transfer File</button>

    </form>
</body>

</html>
